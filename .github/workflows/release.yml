name: Сборка и проверка релиза Лексики

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/нативное-ядро.yml'
      - 'сборка/**'
      - 'packaging/**'
      - 'инструменты/**'
      - 'проверка/**'
      - 'ядро/**'
      - 'cpp/**'
      - 'примеры/**'
      - 'android/**'
      - 'учебная-машина.js'
      - 'лексика/**'
      - 'лексус.lek'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без v для существующего тега (например 0.4.0-beta.1); пусто = nightly'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: leksika-release-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.version != '' && format('v{0}', inputs.version) || github.ref) }}
  cancel-in-progress: false

jobs:
  tests:
    # Повторный запуск того же набора на том же SHA; публикация зависит от всех заданий.
    uses: ./.github/workflows/нативное-ядро.yml
    permissions:
      contents: read

  build-windows:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Проверить шаблоны пакетов
        run: |
          node проверка/пакеты.cjs
          python3 проверка/менеджеры_пакетов.py
      - name: Установить MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Собрать установщик и контрольную сумму
        run: |
          set -euo pipefail
          python3 сборка/собрать_exe.lek
          mkdir -p release
          cp сборка/leksika.exe release/leksika.exe
          python3 -c "from pathlib import Path; p=Path('release/leksika.exe'); assert p.is_file() and p.stat().st_size > 0 and p.read_bytes()[:2] == b'MZ', 'Некорректный PE-файл'"
          (cd release && sha256sum leksika.exe > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: leksika-windows-${{ github.sha }}
          path: release/
          if-no-files-found: error

  smoke-windows:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: leksika-windows-${{ github.sha }}
          path: release
      - name: Проверить скачанный пакет, установку, запуск и удаление
        shell: pwsh
        run: ./проверка/установщик_windows.ps1 -Installer "$PWD/release/leksika.exe" -Checksums "$PWD/release/SHA256SUMS.txt"

  publish-nightly:
    needs: [tests, smoke-windows, prepare-release]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release
      - name: Проверить и опубликовать полный комплект
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -c zz-SHA256SUMS.txt && sha256sum -c zz-checksums.txt)
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main уже указывает на $head; устаревшую сборку не публикуем"
            exit 0
          fi
          files=(release/00-Leksika-Windows.exe release/01-Leksika-Android.apk
            release/leksika-native-windows-x64.zip release/leksika-native-linux-x64.tar.gz
            release/leksika-native-macos-arm64.tar.gz release/leksika-native-macos-x64.tar.gz
            release/leksika-native-android-arm64.tar.gz release/zz-SHA256SUMS.txt release/zz-checksums.txt)
          notes="Windows: 00-Leksika-Windows.exe. Android: 01-Leksika-Android.apk (офлайн учебная песочница, не полный исполнитель). APK подписан временным ключом сборки: для обновления может потребоваться удалить приложение. Windows-установщик не подписан. Архивы содержат экспериментальное нативное ядро. SHA-256: zz-SHA256SUMS.txt. Коммит: $GITHUB_SHA."
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${files[@]}" --clobber
          else
            gh release create nightly "${files[@]}" --target "$GITHUB_SHA" --draft \
              --title 'Leksika — актуальная сборка' --notes "$notes"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" > release-metadata.json
          bash сборка/проверить_публикацию.sh release-metadata.json release
          # Удаляем только старые имена из этого канала после проверки новых файлов.
          for old in leksika.exe SHA256SUMS.txt checksums.txt; do
            if jq -e --arg name "$old" '.assets[] | select(.name == $name)' release-metadata.json >/dev/null; then
              gh release delete-asset nightly "$old" --yes
            fi
          done
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main изменился во время загрузки; метку не обновляем" >&2; exit 1
          fi
          git push origin "$GITHUB_SHA:refs/tags/nightly" --force
          gh release edit nightly --title 'Leksika — актуальная сборка' --notes "$notes" --draft=false --prerelease=false --latest

  # Один комплект для PR, обновляемой сборки main и версионных релизов.
  native-packages:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    name: Нативный пакет ${{ matrix.platform }}
    # Очередь за macOS-раннерами может стоять десятки минут, и это не наша
    # ошибка. Предел не даёт такой джобе висеть час: она падает с внятным
    # «cancelled», а не держит релиз в неизвестности.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x64, os: windows-latest}
          - {platform: linux-x64, os: ubuntu-24.04}
          - {platform: macos-arm64, os: macos-15}
          - {platform: macos-x64, os: macos-15-intel}
          - {platform: android-arm64, os: ubuntu-24.04}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Подготовить Windows-компилятор
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make p7zip
      - name: Собрать Windows-ядро
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -C ядро native TARGET=leksus-core.exe CFLAGS='-std=c11 -O3 -Wall -Wextra -Wpedantic -finput-charset=UTF-8 -fexec-charset=UTF-8 -static'
          bash сборка/пакет_ядра.sh windows-x64
          bash сборка/проверить_пакет_ядра.sh windows-x64
      - name: Собрать и проверить Linux и macOS
        if: runner.os != 'Windows' && matrix.platform != 'android-arm64'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Не выполнена команда на строке $LINENO: $BASH_COMMAND"' ERR
          make -C ядро native TARGET=leksus-core CFLAGS='-std=c11 -O3 -Wall -Wextra -Wpedantic -finput-charset=UTF-8 -fexec-charset=UTF-8'
          bash сборка/пакет_ядра.sh "$PLATFORM"
          bash сборка/проверить_пакет_ядра.sh "$PLATFORM"
          case "$PLATFORM" in
            linux-x64) test "$(uname -m)" = x86_64 ;;
            macos-arm64) test "$(uname -m)" = arm64; info=$(lipo -info package/leksus-core); echo "::notice::lipo: $info"; [[ "$info" == *arm64* ]] ;;
            macos-x64) test "$(uname -m)" = x86_64; info=$(lipo -info package/leksus-core); echo "::notice::lipo: $info"; [[ "$info" == *x86_64* ]] ;;
          esac
      - name: Собрать и проверить Android arm64
        if: matrix.platform == 'android-arm64'
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Не выполнена команда на строке $LINENO: $BASH_COMMAND"' ERR
          compiler="${ANDROID_NDK_HOME:?NDK не найден}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$compiler"
          make -C ядро native TARGET=leksus-core CC="$compiler" CFLAGS='-std=c11 -O3 -Wall -Wextra -Wpedantic -fPIE -pie'
          bash сборка/пакет_ядра.sh android-arm64
          mkdir android-check
          tar -xzf release/leksika-native-android-arm64.tar.gz -C android-check
          readelf -h android-check/leksus-core | grep -q AArch64
          readelf -h android-check/leksus-core | grep -q DYN
          readelf -l android-check/leksus-core | grep -q '/system/bin/linker64'
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ github.sha }}
          path: release/leksika-native-*
          if-no-files-found: error

  build-apk:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Проверить учебную машину
        run: node проверка/android_песочница.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Проверить Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Собрать APK
        run: bash сборка/собрать_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: leksika-apk-${{ github.sha }}
          path: release/01-Leksika-Android.apk
          if-no-files-found: error

  android-smoke:
    needs: [native-packages, build-apk]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-android-arm64-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: leksika-apk-${{ github.sha }}
          path: release
      - name: Разрешить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # Эмулятор в общих раннерах иногда загружается дольше обычного.
          # Запас по времени и отключённые анимации убирают часть случайных падений.
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash сборка/проверить_android.sh && bash сборка/проверить_apk.sh

  prepare-release:
    needs: [native-packages, android-smoke, build-windows, build-apk]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Артефакт со сборкой Windows создаёт другой, сторонний сценарий и в
      # этом прогоне его может не быть вовсе. Загрузка несуществующего имени
      # делает джобу незапускаемой, а вместе с ней срывается весь релиз.
      # Поэтому скачиваем «если есть», а полноту комплекта проверяет скрипт.
      - uses: actions/download-artifact@v4
        with:
          name: leksika-windows-${{ github.sha }}
          path: release
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*-${{ github.sha }}
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: leksika-apk-${{ github.sha }}
          path: release
      - name: Проверить подготовку комплекта
        run: bash проверка/релиз.sh
      - name: Проверить комплект и создать SHA-256
        run: bash сборка/подготовить_релиз.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release/
          if-no-files-found: error

  publish-versioned:
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    needs: [tests, smoke-windows, prepare-release]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Проверить существующий тег и запретить перезапись релиза
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$REF_NAME"; else tag="v$VERSION"; fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo 'Нужен тег v1.0.0 или v0.4.0-beta.1' >&2; exit 1
          fi
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [[ "$commit" != "$GITHUB_SHA" ]]; then echo 'Тег не указывает на проверенный коммит' >&2; exit 1; fi
          # Отличаем 404 от ошибок API и не меняем существующие выпуски.
          code=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent --include 2>&1) && { echo 'Релиз уже существует' >&2; exit 1; }
          if [[ "$code" != *'HTTP/2.0 404'* && "$code" != *'HTTP/1.1 404'* && "$code" != *'HTTP 404'* ]]; then echo "$code" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then echo 'prerelease=true' >> "$GITHUB_OUTPUT"; else echo 'prerelease=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release
      - name: Проверить контрольные суммы перед публикацией
        run: |
          set -euo pipefail
          cd release
          sha256sum -c zz-SHA256SUMS.txt
          sha256sum -c zz-checksums.txt
      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Leksika ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          body: |
            Windows: 00-Leksika-Windows.exe. Android: 01-Leksika-Android.apk — офлайн учебная песочница, не полный исполнитель.
            APK подписан временным ключом сборки: для обновления может потребоваться удаление приложения.
            Нативные пакеты исполняют только подмножество языка, не заменяют полный runtime.
            Android проверен в Android-эмуляторе с трансляцией ARM64, но не на физическом устройстве или в Termux; macOS не подписана и не нотариально заверена.
            Android-архив содержит консольное ядро. SHA-256 всех файлов: zz-SHA256SUMS.txt; архивов отдельно: zz-checksums.txt.
          files: |
            release/00-Leksika-Windows.exe
            release/01-Leksika-Android.apk
            release/leksika-native-windows-x64.zip
            release/leksika-native-linux-x64.tar.gz
            release/leksika-native-macos-arm64.tar.gz
            release/leksika-native-macos-x64.tar.gz
            release/leksika-native-android-arm64.tar.gz
            release/zz-SHA256SUMS.txt
            release/zz-checksums.txt

      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Опубликовать после загрузки всех файлов
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release-metadata.json
          bash сборка/проверить_публикацию.sh release-metadata.json release
          gh release edit "$TAG" --draft=false

  # Обновление внешних пакетных менеджеров идёт строго после публикации
  # версионного релиза: только там появляются архивы и zz-SHA256SUMS.txt, с
  # которых берутся SHA-256. Предварительные версии пропускаются — в tap и
  # bucket попадают только стабильные X.Y.Z.
  #
  # Нужен секрет CROSS_REPO_TOKEN: fine-grained PAT с «Contents: Read and
  # write» на zmlsaggg/homebrew-leksika и zmlsaggg/scoop-leksika. Подробности
  # в RELEASING.md. Токен не нужен для чтения самого релиза: файлы публичные.
  update-package-managers:
    needs: publish-versioned
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.publish-versioned.result == 'success' &&
      !contains(needs.publish-versioned.outputs.version, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Проверить наличие токена доступа к внешним репозиториям
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CROSS_REPO_TOKEN:-}" ]; then
            echo "::error::нет секрета CROSS_REPO_TOKEN: обновить homebrew-leksika и scoop-leksika нельзя. Инструкция — в RELEASING.md."
            exit 1
          fi

      - name: Скачать части релиза (архивы и zz-SHA256SUMS.txt)
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release

      - name: Проверить zz-SHA256SUMS.txt опубликованного комплекта
        shell: bash
        run: |
          set -euo pipefail
          cd release
          # zz-SHA256SUMS.txt уже проверен при публикации; здесь он нужен как
          # источник сумм. Повторная проверка ловит испорченный артефакт.
          sha256sum -c zz-SHA256SUMS.txt
          grep -qE '^[0-9a-f]{64}  leksika-native-macos-arm64\.tar\.gz$' zz-SHA256SUMS.txt
          grep -qE '^[0-9a-f]{64}  leksika-native-macos-x64\.tar\.gz$' zz-SHA256SUMS.txt
          grep -qE '^[0-9a-f]{64}  leksika-native-linux-x64\.tar\.gz$' zz-SHA256SUMS.txt
          grep -qE '^[0-9a-f]{64}  leksika-native-windows-x64\.zip$' zz-SHA256SUMS.txt

      - name: Сверить, что файлы релиза действительно скачиваются
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish-versioned.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Проверяем не только локальный артефакт, но и опубликованный адрес:
          # url в формуле и манифесте должны уже существовать.
          mkdir -p published
          for имя in leksika-native-macos-arm64.tar.gz leksika-native-macos-x64.tar.gz \
                      leksika-native-linux-x64.tar.gz leksika-native-windows-x64.zip \
                      zz-SHA256SUMS.txt; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published \
              --pattern "$имя" --clobber
          done
          cmp published/zz-SHA256SUMS.txt release/zz-SHA256SUMS.txt

      - name: Клонировать репозитории пакетных менеджеров
        shell: bash
        run: |
          set -euo pipefail
          # Чтение публичное, поэтому токен здесь не нужен и в .git/config не
          # попадает: он передаётся только аргументом к git push.
          # --depth 1: нужна лишь вершина main, история для обновления не важна.
          git clone --depth 1 https://github.com/zmlsaggg/homebrew-leksika.git tap
          git clone --depth 1 https://github.com/zmlsaggg/scoop-leksika.git scoop-repo
          test -f tap/Formula/leksika.rb
          test -f scoop-repo/bucket/leksika.json

      - name: Обновить формулу и манифест
        env:
          VERSION: ${{ needs.publish-versioned.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/update_package_managers.py "$VERSION" \
            --sums release/zz-SHA256SUMS.txt \
            --homebrew tap --scoop scoop-repo --verbose

      - name: Проверить изменения перед коммитом
        env:
          VERSION: ${{ needs.publish-versioned.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 проверка/менеджеры_пакетов.py
          # Синтаксис Ruby проверяется, если интерпретатор есть на раннере.
          if command -v ruby >/dev/null 2>&1; then
            ruby -c tap/Formula/leksika.rb
          else
            echo "::notice::ruby не установлен; синтаксис формулы проверен только регулярными выражениями"
          fi
          jq -e '.version != "" and .architecture["64bit"].url and .architecture["64bit"].hash' \
            scoop-repo/bucket/leksika.json >/dev/null
          test -z "$(git -C tap status --porcelain -- Formula/leksika.rb | grep -v '^ M')" || {
            echo "::error::формула изменена неожиданным способом"; exit 1; }
          test -z "$(git -C scoop-repo status --porcelain -- bucket/leksika.json | grep -v '^ M')" || {
            echo "::error::манифест изменён неожиданным способом"; exit 1; }
          git -C tap diff --stat
          git -C scoop-repo diff --stat

      - name: Закоммитить и отправить изменения
        env:
          VERSION: ${{ needs.publish-versioned.outputs.version }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          сообщение="chore: update leksika to v${VERSION}"
          # Токен передаётся аргументом, а не через remote: так он не попадает
          # в .git/config и в трассировку ошибок git. Публичный адрес чтения
          # остаётся в конфиге нетронутым.
          отправить() {
            каталог="$1"; репозиторий="$2"; файл="$3"
            if [ -z "$(git -C "$каталог" status --porcelain -- "$файл")" ]; then
              echo "::notice::$репозиторий уже на версии v${VERSION} — коммит не нужен"
              return 0
            fi
            git -C "$каталог" config user.name 'github-actions[bot]'
            git -C "$каталог" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$каталог" add "$файл"
            git -C "$каталог" commit -m "$сообщение"
            git -C "$каталог" push \
              "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/$репозиторий.git" HEAD:main
            echo "::notice::$репозиторий обновлён до v${VERSION}"
          }
          отправить tap zmlsaggg/homebrew-leksika Formula/leksika.rb
          отправить scoop-repo zmlsaggg/scoop-leksika bucket/leksika.json

      - name: Убедиться, что токен не остался в конфигурации клонов
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for каталог in tap scoop-repo; do
            if [ -d "$каталог/.git" ] && grep -rqE 'x-access-token|ghp_|github_pat_' "$каталог/.git/config"; then
              echo "::error::в $каталог/.git/config найден токен"
              exit 1
            fi
          done
          echo "токенов в конфигурации клонов нет"

  # Отдельная, последняя джоба: антивирусная проверка не должна влиять на
  # выпуск. Она запускается только по тегу, работает на своём раннере и при
  # любой неудаче пишет предупреждение, но не отменяет уже опубликованное.
  virustotal:
    name: Проверка выпуска в VirusTotal
    needs: publish-versioned
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Проверить сам скрипт без сети
        run: python3 проверка/virustotal.py самотест
      - name: Скачать файлы выпуска
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish-versioned.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets
      - name: Прочитать текущее описание выпуска
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish-versioned.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body > описание.md
      - name: Отправить файлы и дописать ссылки в описание
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish-versioned.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Кода возврата намеренно не проверяем: сбой VirusTotal не должен
          # помечать выпуск красным, о нём скажет предупреждение в журнале.
          python3 проверка/virustotal.py отправка \
            --каталог release-assets --добавить-в-описание --описание описание.md || {
              echo '::warning::отправка в VirusTotal не удалась, выпуск не затронут'; exit 0; }
          if [ -s описание.md ]; then
            gh release edit "$TAG" --notes-file описание.md
          else
            echo "::notice::описание не изменилось"
          fi
