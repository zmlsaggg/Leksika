name: Проверка фона сайта

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'игры.html'
      - 'игры.js'
      - 'учебная-машина.js'
      - 'программы/**'
      - 'профиль.html'
      - 'сообщество-исходник.js'
      - 'сообщество-сборка.js'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'проверка/игры.cjs'
      - 'проверка/сообщество.cjs'
      - 'форум.html'
      - 'сообщество.css'
      - 'данные/bad-apple/**'
      - 'styles.css'
      - 'playground.html'
      - 'playground.css'
      - 'playground.js'
      - 'playground-lexicon.js'
      - 'playground-chat.js'
      - 'значки/Лексика-сайт.webp'
      - 'проверка/песочница.cjs'
      - 'фон-анимация.gif'
      - 'фон-сайта-статичный.webp'
      - 'проверка/фон_сайта.cjs'
      - '.github/workflows/сайт.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'игры.html'
      - 'игры.js'
      - 'учебная-машина.js'
      - 'программы/**'
      - 'профиль.html'
      - 'сообщество-исходник.js'
      - 'сообщество-сборка.js'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'проверка/игры.cjs'
      - 'проверка/сообщество.cjs'
      - 'форум.html'
      - 'сообщество.css'
      - 'данные/bad-apple/**'
      - 'styles.css'
      - 'playground.html'
      - 'playground.css'
      - 'playground.js'
      - 'playground-lexicon.js'
      - 'playground-chat.js'
      - 'значки/Лексика-сайт.webp'
      - 'проверка/песочница.cjs'
      - 'фон-анимация.gif'
      - 'фон-сайта-статичный.webp'
      - 'проверка/фон_сайта.cjs'
      - '.github/workflows/сайт.yml'

permissions:
  contents: read

jobs:
  background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверить сборку клиента
        run: |
          npm ci
          npm run build:community
          git diff --exit-code -- сообщество-сборка.js
      - name: Проверить программы на Лексике
        run: node проверка/игры.cjs
      - name: Установить Playwright
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Проверить анимацию в Chromium
        run: node проверка/фон_сайта.cjs
      - name: Проверить песочницу в Chromium
        run: node проверка/песочница.cjs
      - name: Проверить интерфейс сообщества с тестовым API
        run: node проверка/сообщество.cjs
