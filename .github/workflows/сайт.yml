name: Проверка фона сайта

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'главная.css'
      - 'главная.js'
      - 'игры.html'
      - 'игры.js'
      - 'учебная-машина.js'
      - 'программы/**'
      - 'профиль.html'
      - 'сообщество-исходник.js'
      - 'сообщество-сборка.js'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'проверка/игры.cjs'
      - 'проверка/главная.cjs'
      - 'проверка/сообщество.cjs'
      - 'проверка/supabase/**'
      - 'форум.html'
      - 'сообщество.css'
      - 'разделы.css'
      - 'данные/bad-apple/**'
      - 'styles.css'
      - 'статьи.css'
      - 'статьи.html'
      - 'статьи/**'
      - 'о-проекте.html'
      - 'контакты.html'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'документы/АВТОР_И_КОНТАКТЫ.md'
      - 'проверка/сайт_контакты.cjs'
      - 'playground.html'
      - 'playground.css'
      - 'playground.js'
      - 'playground-lexicon.js'
      - 'playground-chat.js'
      - 'значки/Лексика-сайт.webp'
      - 'проверка/песочница.cjs'
      - 'фон-анимация.gif'
      - 'фон-сайта-статичный.webp'
      - 'проверка/фон_сайта.cjs'
      - 'инструменты/sitemap.cjs'
      - '.github/workflows/сайт.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'главная.css'
      - 'главная.js'
      - 'игры.html'
      - 'игры.js'
      - 'учебная-машина.js'
      - 'программы/**'
      - 'профиль.html'
      - 'сообщество-исходник.js'
      - 'сообщество-сборка.js'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'проверка/игры.cjs'
      - 'проверка/главная.cjs'
      - 'проверка/сообщество.cjs'
      - 'проверка/supabase/**'
      - 'форум.html'
      - 'сообщество.css'
      - 'разделы.css'
      - 'данные/bad-apple/**'
      - 'styles.css'
      - 'статьи.css'
      - 'статьи.html'
      - 'статьи/**'
      - 'о-проекте.html'
      - 'контакты.html'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'документы/АВТОР_И_КОНТАКТЫ.md'
      - 'проверка/сайт_контакты.cjs'
      - 'playground.html'
      - 'playground.css'
      - 'playground.js'
      - 'playground-lexicon.js'
      - 'playground-chat.js'
      - 'значки/Лексика-сайт.webp'
      - 'проверка/песочница.cjs'
      - 'фон-анимация.gif'
      - 'фон-сайта-статичный.webp'
      - 'проверка/фон_сайта.cjs'
      - 'инструменты/sitemap.cjs'
      - '.github/workflows/сайт.yml'

permissions:
  contents: read

jobs:
  background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверить сборку клиента
        run: |
          npm ci
          npm run build:community
          git diff --exit-code -- сообщество-сборка.js
      - name: Проверить карту сайта
        run: |
          git show HEAD:sitemap.xml | grep -o '<loc>[^<]*</loc>' | sort > /tmp/sitemap-before.txt
          npm run sitemap
          grep -o '<loc>[^<]*</loc>' sitemap.xml | sort > /tmp/sitemap-after.txt
          diff /tmp/sitemap-before.txt /tmp/sitemap-after.txt
      - name: Проверить контакты, автора и разметку страниц
        run: node проверка/сайт_контакты.cjs
      - name: Проверить программы на Лексике
        run: node проверка/игры.cjs
      - name: Проверить образцы главной
        run: node проверка/главная.cjs
      - name: Установить Playwright
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Проверить анимацию в Chromium
        run: node проверка/фон_сайта.cjs
      - name: Проверить песочницу в Chromium
        run: node проверка/песочница.cjs
      - name: Проверить интерфейс сообщества с тестовым API
        run: node проверка/сообщество.cjs
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Проверить схему и политики на тестовой базе
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f проверка/supabase/подготовка.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/схема.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f проверка/supabase/политики.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/форум-ответы.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f проверка/supabase/форум.sql
