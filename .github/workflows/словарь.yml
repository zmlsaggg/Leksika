name: Публикация словаря для GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ядро/**"
      - "лексика/**"
      - "лексус.lek"
      - "Leksika"
      - "Leksika.cmd"
      - "установить.lek"
      - "проверка/**"
      - "источники/russian-words/**"
      - ".gitmodules"
      - "playground.html"
      - "playground-lexicon.js"
      - "!ядро/русские_формы.lxd.gz"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-dictionary:
    name: Publish compressed dictionary for GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Получить исходный код и закреплённый словарь
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Собрать и сжать бинарный индекс
        run: |
          make dictionary
          gzip -n -9 -c русские_формы.lxd > русские_формы.lxd.gz
          ls -lh русские_формы.lxd.gz
          sha256sum русские_формы.lxd.gz
        working-directory: ядро
        shell: bash

      - name: Опубликовать индекс в GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ядро/русские_формы.lxd.gz
          if git diff --cached --quiet; then
            echo "Опубликованный индекс не изменился."
            exit 0
          fi
          git commit -m "Publish compressed Russian word index"
          git push
        shell: bash
