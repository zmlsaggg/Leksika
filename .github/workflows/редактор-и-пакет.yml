name: Редактор и нативный пакет

on:
  push:
    branches: [main]
    paths:
      - 'vscode-leksika/**'
      - 'aur/leksika-git/**'
      - 'лексика/словарь.lek'
      - 'лексика/морфология.lek'
      - 'ядро/**'
      - '.github/workflows/редактор-и-пакет.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vscode-leksika/**'
      - 'aur/leksika-git/**'
      - 'лексика/словарь.lek'
      - 'лексика/морфология.lek'
      - 'ядро/**'
      - '.github/workflows/редактор-и-пакет.yml'

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 vscode-leksika/scripts/generate.py && git diff --exit-code -- vscode-leksika/syntaxes/leksika.tmLanguage.json
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
        working-directory: vscode-leksika
      - run: npx --yes @vscode/vsce@4.1.1 package --out /tmp/leksika.vsix
        working-directory: vscode-leksika
  package-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверить функции PKGBUILD в чистом дереве
        shell: bash
        run: |
          set -euo pipefail
          export srcdir="$(mktemp -d)" pkgdir="$(mktemp -d)"
          git clone --quiet --no-local . "$srcdir/Leksika"
          source aur/leksika-git/PKGBUILD
          [[ $(pkgver) =~ ^r[0-9]+\.[0-9a-f]{12}$ ]]
          build
          check
          package
          "$pkgdir/usr/bin/leksika" самопроверка
          "$pkgdir/usr/bin/leksika" слово книга "$pkgdir/usr/share/leksika/русские_формы.lxd"
          test -f "$pkgdir/usr/share/licenses/leksika-git/LICENSE"
          test -f "$pkgdir/usr/share/licenses/leksika-git/DICTIONARY-LICENSE"
