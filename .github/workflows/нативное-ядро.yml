name: Проверка нативного ядра

on:
  push:
    branches:
      - main
    paths:
      - "ядро/**"
      - "лексика/**"
      - "лексус.lek"
      - "Leksika"
      - "Leksika.cmd"
      - "установить.lek"
      - "проверка/**"
      - "источники/russian-words/**"
      - ".gitmodules"
      - ".github/workflows/нативное-ядро.yml"
      - "playground.html"
      - "playground-lexicon.js"
      - "!ядро/русские_формы.lxd.gz"
  pull_request:
    branches:
      - main
    paths:
      - "ядро/**"
      - "лексика/**"
      - "лексус.lek"
      - "Leksika"
      - "Leksika.cmd"
      - "установить.lek"
      - "проверка/**"
      - "источники/russian-words/**"
      - ".gitmodules"
      - ".github/workflows/нативное-ядро.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: ${{ matrix.os }} — полная сборка и тесты
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Получить исходный код и словарь
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Установить MinGW-w64 и Make
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make

      - name: Проверить версию компилятора
        run: cc --version
        shell: bash

      - name: Собрать ядро и словарь на Linux
        if: runner.os == 'Linux'
        run: make clean all test 2>&1 | tee словарь-сборки.txt
        working-directory: ядро
        shell: bash

      - name: Собрать ядро и словарь на Windows
        if: runner.os == 'Windows'
        run: make clean all test 2>&1 | tee словарь-сборки.txt
        working-directory: ядро
        shell: msys2 {0}

      - name: Сохранить индекс и отчёт словаря
        uses: actions/upload-artifact@v4
        with:
          name: русский-словарь-${{ matrix.os }}
          path: |
            ядро/русские_формы.lxd
            ядро/словарь-сборки.txt

      - name: Сопоставить нативный и переходный движки на общем подмножестве
        if: runner.os == 'Linux'
        run: |
          python3 проверка/тесты.lek
          python3 проверка/удобство.py
          python3 проверка/сопоставление_движков.py
        shell: bash
  sanitizer-tests:
    name: Linux — AddressSanitizer и UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код и словарь
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Полная сборка и тесты с санитайзерами
        run: make sanitize-test
        working-directory: ядро
        shell: bash

  publish-dictionary:
    name: Publish compressed dictionary for GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Получить исходный код и закреплённый словарь
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Собрать и сжать бинарный индекс
        run: |
          make dictionary
          gzip -n -9 -c русские_формы.lxd > русские_формы.lxd.gz
          ls -lh русские_формы.lxd.gz
          sha256sum русские_формы.lxd.gz
        working-directory: ядро
        shell: bash

      - name: Опубликовать индекс в GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ядро/русские_формы.lxd.gz
          if git diff --cached --quiet; then
            echo "Опубликованный индекс не изменился."
            exit 0
          fi
          git commit -m "Publish compressed Russian word index"
          git push
        shell: bash
