name: Проверка нативного ядра

on:
  push:
    branches:
      - main
    paths:
      - "ядро/**"
      - "лексика/**"
      - "лексус.lek"
      - "Leksika"
      - "Leksika.cmd"
      - "установить.lek"
      - "проверка/**"
      - "источники/russian-words/**"
      - ".gitmodules"
      - ".github/workflows/нативное-ядро.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ядро/**"
      - "лексика/**"
      - "лексус.lek"
      - "Leksika"
      - "Leksika.cmd"
      - "установить.lek"
      - "проверка/**"
      - "источники/russian-words/**"
      - ".gitmodules"
      - ".github/workflows/нативное-ядро.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: ${{ matrix.os }} — полная сборка и тесты
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Получить исходный код и словарь
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Установить MinGW-w64 и Make
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make

      - name: Проверить версию компилятора
        run: cc --version
        shell: bash

      - name: Собрать нативное ядро и полный словарный индекс, затем выполнить тесты
        run: make -C ядро clean all test
        shell: bash

      - name: Сопоставить нативный и переходный движки на общем подмножестве
        if: runner.os == 'Linux'
        run: |
          python3 проверка/тесты.lek
          python3 проверка/удобство.py
          python3 проверка/сопоставление_движков.py
        shell: bash
